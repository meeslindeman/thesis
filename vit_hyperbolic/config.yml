# LorentzViT 
# Architecture 
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
mlp_dim: 3072
patch_size: 4
patch_embed_type: linear
final_op: pooling

# Optimizer 
lr: 1e-3 # tiny
weight_decay: 0.05
optimizer: adamw
scheduler: warmup_cosine
warmup_epochs: 5

# Regularization
dropout_rate: 0.0
attn_dropout_rate: 0.1
stochastic_depth_rate: 0.0
label_smoothing: 0.1
lambda_margin: 0.0
layernorm: true

# Hyperbolic
curvature: 1.0
residual_weight_init: 0.0
residual_delta_init: 2.0
concat_mode: direct
compute_scores: lorentz_inner
reset_params: xavier
a_default: 0.05
use_weight_norm: false