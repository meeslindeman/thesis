# Euclidean ViT --- Parameters adapted from Hexformer
# Architecture
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
mlp_dim: 3072
patch_size: 4
patch_embed_type: linear
final_op: cls

# Optimizer
lr: 4.15e-3
weight_decay: 6e-2
scheduler: cosine
warmup_epochs: 0

# Regularization
dropout_rate: 0.0
attn_dropout_rate: 0.0
stochastic_depth_rate: 0.1
label_smoothing: 0.1
