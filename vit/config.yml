# Euclidean ViT --- Parameters adapted from DeiT-Base
# Architecture 
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
mlp_dim: 3072
patch_size: 4
patch_embed_type: linear
final_op: cls

# Optimizer
lr: 1.25e-4 # lr = 0.005 * (batch_size / 512) 
weight_decay: 0.05
scheduler: warmup_cosine
warmup_epochs: 5

# Regularization 
dropout_rate: 0.0
attn_dropout_rate: 0.0
stochastic_depth_rate: 0.1
label_smoothing: 0.1
