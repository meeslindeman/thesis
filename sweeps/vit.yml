program: hyperbolic/train_wandb.py
method: random

metric:
  name: test/acc
  goal: maximize

parameters:
  wandb:
    value: 1
  wandb_project:
    value: hyperbolic-vit
  wandb_entity:
    value: hyperbolic-vit-team

  epochs:
    value: 5
  batch_size:
    value: 128

  lr:
    values: [1e-4, 3e-4, 1e-3, 3e-3]
  weight_decay:
    values: [0.0, 1e-5, 1e-4, 1e-3]

  dropout_rate:
    values: [0.0, 0.1, 0.2]
  head_mode:
    values: ["full_midpoint", "split_concat"]

  curvature:
    value: 0.1
  concat_mode:
    value: direct
  compute_scores:
    value: lorentz_inner
  reset_params:
    values: ["lorentz_kaiming", "kaiming", "xavier"]
  a_default:
    value: 0.0
