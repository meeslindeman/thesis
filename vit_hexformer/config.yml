# HexFormer - (Lorentz encoder + Lorentz decoder)
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
mlp_dim: 3072
patch_size: 4

# Optimizer
lr: 3.076e-3
weight_decay: 1e-1
scheduler: warmup_cosine
warmup_epochs: 10

# Regularization
label_smoothing: 0.1
dropout_rate: 0.0

# Hyperbolic
curvature: 1.0
learn_k: false
clip_features: 1.0
