# HyperCore
# Architecture 
hidden_size: 780
num_hidden_layers: 12
num_attention_heads: 12
mlp_dim: 3072
patch_size: 4

# Optimizer 
lr: 1e-4
weight_decay: 1e-2
hyp_lr: 1e-4
hyp_weight_decay: 1e-4
stabilize: 1
scheduler: warmup_step
lr_step_size: 10
lr_gamma: 0.1

# Regularization 
dropout_rate: 0.1
stochastic_depth_rate: 0.0
label_smoothing: 0.1

# Hyperbolic
curvature: 1.0
